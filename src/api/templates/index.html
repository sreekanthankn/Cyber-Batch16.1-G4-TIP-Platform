<!DOCTYPE html>
<html>
<head>
    <title>Cyber-TIP SOC Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #2d2d2d; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 5px solid #007bff; }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        button { padding: 15px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1em; }
        .btn-intel { background: #28a745; color: white; flex: 1; min-width: 150px; }
        .btn-enforce { background: #007bff; color: white; flex: 1; min-width: 150px; }
        .btn-batch { background: #6f42c1; color: white; flex: 1; min-width: 150px; }
        .btn-test { background: #ffc107; color: black; min-width: 150px; }
        .btn-rollback { background: #dc3545; color: white; }
        .btn-stop { background: #ff4757; color: white; width: 100%; margin-top: 10px; display: none; }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .diagnostic-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 4px; border: 1px solid #444; background: #111; color: #0f0; font-family: monospace; }
        #test-result-display { margin-top: 15px; padding: 20px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.3em; display: none; transition: 0.5s; }
        #terminal { background: #000; color: #0f0; padding: 15px; border-radius: 5px; height: 350px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; border: 1px solid #444; line-height: 1.4; }
        #progress-bar-container { width: 100%; background-color: #444; border-radius: 5px; margin-bottom: 10px; display: none; }
        #progress-bar { width: 0%; height: 12px; background-color: #28a745; border-radius: 5px; transition: width 0.4s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Cyber-TIP Operations Center</h1>
        
        <div class="card">
            <h3>Control Modules</h3>
            <div class="btn-group">
                <button class="btn-intel" onclick="runTask('intel')">Update Intel</button>
                <button class="btn-enforce" onclick="runTask('enforce')">Push Defense</button>
                <button class="btn-batch" onclick="runTask('auto_test')">Batch Pentest</button>
                <button style="background: #17a2b8; color: white; flex: 1;" onclick="showBlockedList()">View Blocklist</button>
                <button class="btn-rollback" onclick="runTask('rollback')">Rollback</button>
            </div>
            <!-- STOP BUTTON ADDED HERE -->
            <button id="stop-btn" class="btn-stop" onclick="terminateTask()">⏹️ Stop Active Task</button>

            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
            
            <h3>Network Diagnostic & Pen-Test</h3>
<div class="diagnostic-row">
    <input type="text" id="test-url" placeholder="Enter Site URL (e.g., google.com)">
    <button class="btn-test" onclick="runCustomTest()">Run Connectivity Check</button>
    <!-- New Unblock Button -->
    <button style="background: #6c757d; color: white;" onclick="unblockTarget()">Unblock This IP</button>
</div>
<div id="test-result-display">🔍 Initializing Test...</div>
        </div>

        <div class="card">
            <h3>Execution Logs</h3>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
                <small id="status-text" style="color: #0f0;">System standby...</small>
            </div>
            <div id="blocklist-container" class="card" style="display:none; border-left: 5px solid #17a2b8;">
    <div style="display:flex; justify-content:space-between;">
        <h3>Active Threat Blocklist (Top 50)</h3>
        <button onclick="document.getElementById('blocklist-container').style.display='none'" style="background:none; color:white; font-size:1.5em; padding:0;">×</button>
    </div>
    <div id="blocklist-content" style="max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.9em;"></div>
</div>
            <div id="terminal">System Ready. Awaiting instructions...</div>
        </div>
    </div>

<script>
    let taskInterval;

    function runTask(task) {
        const term = document.getElementById('terminal');
        const progressBar = document.getElementById('progress-bar');
        const container = document.getElementById('progress-bar-container');
        const statusText = document.getElementById('status-text');
        const stopBtn = document.getElementById('stop-btn');

        // Reset UI
        term.innerHTML += `<br>> Starting ${task}...`;
        container.style.display = 'block';
        stopBtn.style.display = 'block';
        progressBar.style.width = '0%';
        statusText.innerText = "Initializing " + task + "...";
        
        let width = 0;
        clearInterval(taskInterval);

        // Smart Progress Bar Interval
    // Inside runTask function in index.html
    taskInterval = setInterval(() => {
        if (width < 95) {
            if (task === 'intel') {
                width += 0.5; 
            } else if (task === 'auto_test') {
                width += 4; // FASTER: Moves roughly 4% per second, hitting 90% in ~22s
            } else {
                width += 5; 
            }
            progressBar.style.width = width + '%';
            statusText.innerText = "Processing " + task + "...";
        }
    }, 1000);

        fetch(`/execute/${task}`)
            .then(res => res.json())
            .then(data => {
                completeUI(data.output);
            })
            .catch(err => handleError(err));
    }

    function runCustomTest() {
        const url = document.getElementById('test-url').value;
        const display = document.getElementById('test-result-display');
        const term = document.getElementById('terminal');

        if (!url) return alert("Please enter a URL or IP.");

        display.style.display = 'block';
        display.style.background = '#444';
        display.innerHTML = `🔍 Testing Connectivity to ${url}...`;
        term.innerHTML += `<br>> Diagnosing connection to: ${url}`;

        fetch(`/execute/test?target=${url}`)
            .then(res => res.json())
            .then(data => {
                term.innerHTML += `<pre>${data.output}</pre>`;
                term.scrollTop = term.scrollHeight;

                if (data.status === "blocked") {
                    display.style.background = "#dc3545";
                    display.innerHTML = "🚫 ACCESS BLOCKED: Firewall Active";
                } else {
                    display.style.background = "#28a745";
                    display.innerHTML = "✅ ACCESS OPEN: Site Reachable";
                }
            })
            .catch(err => handleError(err));
    }

    function completeUI(output) {
        clearInterval(taskInterval);
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('status-text').innerText = "Task Complete!";
        const term = document.getElementById('terminal');
        term.innerHTML += `<pre>${output}</pre>`;
        term.scrollTop = term.scrollHeight;
        
        setTimeout(() => {
            document.getElementById('progress-bar-container').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'none';
        }, 3000);
    }

    function handleError(err) {
        clearInterval(taskInterval);
        const term = document.getElementById('terminal');
        term.innerHTML += `<br><span style="color:red;">[!] Error: ${err}</span>`;
        document.getElementById('progress-bar-container').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'none';
    }

    function terminateTask() {
        fetch('/terminate_task', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                const term = document.getElementById('terminal');
                term.innerHTML += `<br><span style="color:orange;">[!] ${data.message}</span>`;
                document.getElementById('progress-bar-container').style.display = 'none';
                document.getElementById('stop-btn').style.display = 'none';
                clearInterval(taskInterval);
            });
    }
    function unblockTarget() {
    const url = document.getElementById('test-url').value;
    const display = document.getElementById('test-result-display');
    const term = document.getElementById('terminal');

    if (!url) return alert("Enter an IP to unblock.");

    display.style.display = 'block';
    display.style.background = '#444';
    display.innerHTML = `♻️ Attempting to unblock ${url}...`;

    fetch(`/execute/unblock?target=${url}`)
        .then(res => res.json())
        .then(data => {
            term.innerHTML += `<br>> ${data.output}`;
            term.scrollTop = term.scrollHeight;
            
            if (data.status === "open") {
                display.style.background = "#28a745"; // Success Green
                display.innerHTML = `✅ ${url} is now ALLOWED`;
            } else {
                display.style.background = "#dc3545"; // Error Red
                display.innerHTML = "❌ Unblock Failed";
            }
        });
    }
    function showBlockedList() {
    const container = document.getElementById('blocklist-container');
    const content = document.getElementById('blocklist-content');
    
    container.style.display = 'block';
    content.innerHTML = "⌛ Correlating Kernel Rules with Threat Intel...";

    fetch('/execute/view_blocked')
        .then(res => res.json())
        .then(data => {
            if (data.items && data.items.length > 0) {
                let html = '<table style="width:100%; text-align:left; border-collapse: collapse;">';
                html += '<tr style="border-bottom: 2px solid #17a2b8;"><th>Blocked IP</th><th>Source/URL</th><th>Risk Score</th></tr>';
                
                data.items.forEach(item => {
                    html += `<tr style="border-bottom: 1px solid #333; height: 35px;">
                        <td style="color:#ff4757; font-weight:bold; font-family:monospace;">${item.indicator}</td>
                        <td style="color:#0f0; font-size:0.85em;">${item.url}</td>
                        <td style="text-align:center;"><span style="background:#444; padding:2px 8px; border-radius:4px;">${item.score}</span></td>
                    </tr>`;
                });
                html += '</table>';
                content.innerHTML = html;
            } else {
                content.innerHTML = "No active high-risk rules found in the kernel.";
            }
        });
}
</script>
</body>
</html>
